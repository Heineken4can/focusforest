<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2536f4",
                        "background-light": "#f5f6f8",
                        "background-dark": "#101122",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-panel {
            background: rgba(37, 54, 244, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .timer-glow {
            text-shadow: 0 0 30px rgba(37, 54, 244, 0.4);
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<nav class="flex items-center justify-between p-6 w-full max-w-2xl mx-auto">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">close</span>
</button>
<div class="flex flex-col items-center">
<span class="text-xs font-bold uppercase tracking-widest text-primary/80 mb-1">Current Task</span>
<h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-slate-100">System Architecture</h1>
</div>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">battery_charging_full</span>
</button>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
<!-- Background Decorative Glows -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-primary/20 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute top-1/4 right-0 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
<!-- Timer Section -->
<div class="relative flex items-center justify-center">
<!-- Circular Progress Indicator -->
<svg class="progress-ring w-[320px] h-[320px] md:w-[400px] md:h-[400px]">
<circle class="text-slate-200 dark:text-slate-800" cx="160" cy="160" fill="transparent" r="150" stroke="currentColor" stroke-width="4" style="r: clamp(140px, 35vw, 180px); cx: 50%; cy: 50%;"></circle>
<circle class="text-primary" cx="160" cy="160" fill="transparent" r="150" stroke="currentColor" stroke-dasharray="1000" stroke-dashoffset="250" stroke-linecap="round" stroke-width="4" style="r: clamp(140px, 35vw, 180px); cx: 50%; cy: 50%;"></circle>
</svg>
<!-- Countdown Timer -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="text-7xl md:text-9xl font-extrabold tracking-tighter text-slate-900 dark:text-slate-50 timer-glow">
                    25:00
                </div>
<div class="mt-4 px-4 py-1.5 rounded-full bg-primary/10 border border-primary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-sm text-primary">auto_awesome</span>
<span class="text-sm font-semibold text-primary">Focusing...</span>
</div>
</div>
</div>
<!-- Session Message Card -->
<div class="mt-16 w-full max-w-sm glass-panel p-6 rounded-2xl text-center">
<p class="text-slate-600 dark:text-slate-400 leading-relaxed">
                Deep work session in progress. <br/>
                Your mind is quiet, your focus is sharp.
            </p>
<div class="mt-6 flex items-center justify-center gap-8">
<div class="flex flex-col items-center">
<span class="text-2xl font-bold text-slate-900 dark:text-slate-100">25</span>
<span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Minutes</span>
</div>
<div class="h-8 w-px bg-slate-200 dark:bg-slate-800"></div>
<div class="flex flex-col items-center">
<span class="text-2xl font-bold text-slate-900 dark:text-slate-100">00</span>
<span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Seconds</span>
</div>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-8 flex flex-col items-center gap-6">
<div class="w-full max-w-xs h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-full shadow-[0_0_12px_rgba(37,54,244,0.5)]"></div>
</div>
<button class="group flex items-center gap-2 px-8 py-3 rounded-full bg-transparent border border-slate-200 dark:border-slate-800 hover:border-red-500/50 hover:bg-red-500/5 transition-all duration-300">
<span class="material-symbols-outlined text-slate-400 group-hover:text-red-500 transition-colors">logout</span>
<span class="text-sm font-bold text-slate-600 dark:text-slate-400 group-hover:text-red-500 transition-colors">Give Up</span>
</button>
</footer>
</body></html>
