<!DOCTYPE html>
<html lang="ko" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Forest - 집중 모드 타이머 (Toss Style)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        toss: {
                            bg: '#0B0E14',
                            surface: '#181B23',
                            surfaceHover: '#222631',
                            selected: '#1E2D4A',
                            blue: '#3182F6',
                            onPrimary: '#0B0E14',
                            green: '#1AC97E',
                            red: '#F04452',
                            textMain: '#F2F4F6',
                            textSub: '#8B95A1',
                            divider: '#2A2D36',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: theme('fontFamily.sans');
            background-color: #0B0E14;
            color: #F2F4F6;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        /* --------------------------------------
         * 타이머 SVG 진행률 계산 공식 (FE 핸드오프 참조용)
         * r = 220 → circumference = 2 * π * 220 ≈ 1382.3
         * stroke-dashoffset = circumference × (1 - elapsed/total)
         * 예) 15/25분 경과 → offset = 1382.3 × (1 - 15/25) = 552.92
         * -------------------------------------- */
        .progress-ring__circle {
            /* [fix M-2] 공식 주석 위에 명시 */
            transition: stroke-dashoffset 1s linear;
            stroke-linecap: round;
        }

        /* 대시보드 → 집중 모드 전환 트랜지션 [fix M-3] */
        /* duration-400 ease-in-out 기준값 사용 */
        .dim-transition {
            transition: opacity 400ms ease-in-out, filter 400ms ease-in-out;
        }
    </style>
</head>

<body class="flex h-screen overflow-hidden antialiased">

    <!-- ========================================
         LEFT NAV : Dimmed (Read-Only in Focus Mode)
         Desktop lg: 좁은 아이콘 전용 사이드바
         Mobile: 숨김
         ======================================== -->
    <aside class="
        hidden lg:flex
        w-20 flex-col items-center
        py-8 border-r border-toss-divider
        bg-toss-surface/30
        dim-transition opacity-40 pointer-events-none
    ">
        <div class="mb-10">
            <div class="w-10 h-10 rounded-full bg-toss-blue/40 flex items-center justify-center">
                <span class="material-symbols-rounded text-white text-lg">forest</span>
            </div>
        </div>
        <nav class="flex flex-col gap-8">
            <span class="material-symbols-rounded text-toss-textSub text-2xl">home</span>
            <span class="material-symbols-rounded text-toss-blue text-2xl">timer</span>
            <span class="material-symbols-rounded text-toss-textSub text-2xl">person</span>
        </nav>
    </aside>

    <!-- ========================================
         MAIN TIMER AREA (모든 기기 공통)
         ======================================== -->
    <main class="flex-1 relative flex flex-col items-center justify-center p-6 lg:p-8 bg-toss-bg overflow-hidden">

        <!-- Background Glow -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
            <div class="w-[500px] h-[500px] bg-toss-blue rounded-full blur-[150px]"></div>
        </div>

        <div class="relative z-10 flex flex-col items-center w-full max-w-md lg:max-w-lg">

            <!-- Task Label -->
            <div class="text-center mb-8 lg:mb-12">
                <span
                    class="inline-flex items-center px-3 py-1 mb-4 rounded-full bg-toss-blue/10 text-toss-blue text-sm font-bold">
                    <span class="w-2 h-2 rounded-full bg-toss-blue mr-2 animate-pulse"></span>
                    집중 모드 진행 중
                </span>
                <h2 class="text-2xl lg:text-3xl font-bold text-toss-textMain">UI 디자인 시스템 완료하기</h2>
                <p class="text-toss-textSub font-medium mt-2">Design • 핵심 과제</p>
            </div>

            <!-- Timer Circle -->
            <!-- circumference = 2π × r = 2π × 220 ≈ 1382.3 -->
            <!-- 현재 60% 진행: offset = 1382.3 × 0.4 = 552.92 -->
            <div class="relative select-none mb-8 lg:mb-12" style="width:min(320px, 80vw); height:min(320px, 80vw);">
                <svg class="w-full h-full" viewBox="0 0 480 480" style="transform: rotate(-90deg);">
                    <!-- Track -->
                    <circle cx="240" cy="240" fill="transparent" r="220" stroke="#181B23" stroke-width="10"></circle>
                    <!-- Progress [fix T-1] toss.blue hex 직접 참조 -->
                    <circle class="progress-ring__circle" cx="240" cy="240" fill="transparent" r="220" stroke="#3182F6"
                        stroke-dasharray="1382.3" stroke-dashoffset="552.92" stroke-width="14"
                        style="filter: drop-shadow(0 0 10px rgba(49,130,246,0.6))"></circle>
                </svg>
                <!-- Timer Numbers -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="font-extrabold tabular-nums leading-none"
                        style="font-size: clamp(3rem, 15vw, 6rem); color: #F2F4F6;">15:00</span>
                    <span class="text-base lg:text-xl font-bold mt-1" style="color: #3182F6;">/ 25:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="hidden lg:flex items-center gap-3 lg:gap-6 w-full px-2 lg:px-8">
                <!-- Give Up (Danger) -->
                <button class="flex-1 bg-toss-surface hover:bg-toss-surfaceHover text-toss-textMain font-bold py-4 px-4 lg:px-6 rounded-2xl flex items-center justify-center gap-2 transition-colors duration-150 border border-toss-divider
                               disabled:opacity-40 disabled:pointer-events-none">
                    <span class="material-symbols-rounded" style="color:#F04452">stop_circle</span>
                    <span class="text-sm lg:text-base">포기하기</span>
                </button>

                <!-- Pause (Primary) -->
                <button class="flex-[1.5] font-bold py-4 px-4 lg:px-6 rounded-2xl flex items-center justify-center gap-2 transition-all duration-150
                               hover:bg-blue-600 active:scale-95"
                    style="background:#3182F6; color:#0B0E14; box-shadow:0 4px 14px 0 rgba(49,130,246,0.39)">
                    <span class="material-symbols-rounded">pause</span>
                    <span class="text-sm lg:text-base">일시정지</span>
                </button>
            </div>

        </div>
    </main>

    <!-- ========================================
         RIGHT SIDEBAR : Desktop Only (Read-Only)
         ======================================== -->
    <aside class="
        hidden lg:flex
        w-80 flex-col px-6 py-8
        bg-toss-surface/30 border-l border-toss-divider
        dim-transition opacity-40 pointer-events-none
    ">
        <div class="flex items-center justify-between mb-8">
            <h3 class="text-lg font-bold">다음 할 일</h3>
        </div>

        <div class="space-y-4">
            <div class="flex items-center gap-3 p-4 rounded-xl">
                <span class="material-symbols-rounded text-toss-textSub">circle</span>
                <p class="font-bold text-toss-textMain text-sm">주간 리포트 작성</p>
            </div>
            <div class="flex items-center gap-3 p-4 rounded-xl">
                <span class="material-symbols-rounded text-toss-textSub">circle</span>
                <p class="font-bold text-toss-textMain text-sm">아침 운동 및 명상</p>
            </div>
        </div>

        <div class="mt-auto text-center">
            <span class="material-symbols-rounded text-4xl text-toss-textSub">lock</span>
            <p class="text-sm font-semibold text-toss-textSub mt-2">집중 모드 중에는<br />다른 작업을 할 수 없어요</p>
        </div>
    </aside>

    <!-- ========================================
         MOBILE BOTTOM BAR : 모바일 타이머 환경
         (극도로 절제된 컨트롤만 노출)
         ======================================== -->
    <div
        class="lg:hidden fixed bottom-0 left-0 right-0 bg-toss-bg/90 backdrop-blur border-t border-toss-divider px-4 py-4 flex gap-3 z-50">
        <button
            class="flex-1 bg-toss-surface text-toss-textMain font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 border border-toss-divider">
            <span class="material-symbols-rounded text-sm" style="color:#F04452">stop_circle</span>
            <span class="text-sm">포기하기</span>
        </button>
        <button class="flex-[1.5] font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2"
            style="background:#3182F6; color:#0B0E14;">
            <span class="material-symbols-rounded text-sm">pause</span>
            <span class="text-sm">일시정지</span>
        </button>
    </div>

</body>

</html>
